name: Codex Hybrid Downloader (Offline Resistant)

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: "Codex Product ID"
        default: "9PLM9XGG6VKS"
        required: false
      upload_method:
        type: choice
        options: [repository, release]
        default: repository
      release_tag:
        required: false
        default: ""
      clean_previous:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt update
        sudo apt install -y curl jq python3

    # ─────────────────────────────
    # Clean
    # ─────────────────────────────
    - name: Clean downloads
      if: ${{ inputs.clean_previous == true }}
      run: rm -rf downloads && mkdir -p downloads

    # ─────────────────────────────
    # Try 1: Microsoft Store Manifest
    # ─────────────────────────────
    - name: Fetch MS Store manifest
      continue-on-error: true
      run: |
        curl -L --retry 3 --fail \
        "https://storeedgefd.dsx.mp.microsoft.com/v9.0/packageManifests/${{ inputs.product_id }}" \
        -o manifest.json || echo "FAILED" > msstore_fail.txt

    # ─────────────────────────────
    # Extract MSIX link (robust)
    # ─────────────────────────────
    - name: Extract MS Store URL
      continue-on-error: true
      run: |
        python3 << 'EOF'
        import re, json, os

        if not os.path.exists("manifest.json"):
            open("msstore_fail.txt","w").write("no manifest")
            exit(0)

        data = open("manifest.json","r",encoding="utf-8",errors="ignore").read()

        urls = re.findall(r"https?://[^\"']+\.msixbundle[^\"']*", data)

        if not urls:
            open("msstore_fail.txt","w").write("no url")
            exit(0)

        url = None
        for u in urls:
            if "x64" in u:
                url = u
                break
        if not url:
            url = urls[0]

        open("url_msstore.txt","w").write(url)
        print(url)
        EOF

    # ─────────────────────────────
    # Try 2: GitHub fallback (official repo releases)
    # ─────────────────────────────
    - name: Fallback GitHub releases
      if: failure() || steps.extract.outputs == null
      run: |
        echo "Trying GitHub fallback..."

        curl -L \
        https://api.github.com/repos/openai/codex/releases/latest \
        -o release.json || true

        cat release.json | jq -r '
          .assets[].browser_download_url
        ' | grep -iE "windows|msix|exe|codex" | head -n 1 > url_fallback.txt || true

    # ─────────────────────────────
    # Choose best URL
    # ─────────────────────────────
    - name: Resolve final URL
      run: |
        if [ -f url_msstore.txt ]; then
          URL=$(cat url_msstore.txt)
        elif [ -f url_fallback.txt ]; then
          URL=$(cat url_fallback.txt)
        else
          echo "NO_DOWNLOAD_URL_FOUND" && exit 1
        fi

        echo "URL=$URL" >> $GITHUB_ENV
        echo "FINAL URL: $URL"

    # ─────────────────────────────
    # Download with retries
    # ─────────────────────────────
    - name: Download Codex
      run: |
        mkdir -p downloads

        for i in 1 2 3 4; do
          echo "Attempt $i"
          curl -L --fail --retry 3 "$URL" -o downloads/codex.msixbundle && break
          sleep 10
        done

    # ─────────────────────────────
    # Validate
    # ─────────────────────────────
    - name: Validate file
      run: |
        ls -lh downloads
        file downloads/codex.msixbundle || true

    # ─────────────────────────────
    # Commit (chunk-safe)
    # ─────────────────────────────
    - name: Commit to repo
      if: ${{ inputs.upload_method == 'repository' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "bot@users.noreply.github.com"

        git add downloads/codex.msixbundle

        git commit -m "Codex bundle update" || echo "no changes"
        git push

    # ─────────────────────────────
    # Release mode
    # ─────────────────────────────
    - name: Release upload
      if: ${{ inputs.upload_method == 'release' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('codex-{0}', github.run_number) }}
        name: Codex Build
        files: downloads/codex.msixbundle

    # ─────────────────────────────
    # Cleanup
    # ─────────────────────────────
    - name: Cleanup
      if: always()
      run: |
        rm -f manifest.json release.json url_*.txt msstore_fail.txt
