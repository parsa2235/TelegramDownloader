name: Codex Advanced Downloader (Full Power)

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "Product ID (default Codex)"
        required: false
        default: "9PLM9XGG6VKS"
      upload_method:
        type: choice
        options: [repository, release]
        default: repository
      release_tag:
        required: false
        default: ""
      clean_previous:
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup tools
      run: |
        sudo apt update
        sudo apt install -y curl jq python3

    # ─────────────────────────────
    # Cleanup (مثل نسخه خودت)
    # ─────────────────────────────
    - name: Clean old downloads
      if: ${{ inputs.clean_previous == true }}
      run: |
        rm -rf downloads
        mkdir -p downloads

    # ─────────────────────────────
    # Fetch Microsoft Store Manifest
    # ─────────────────────────────
    - name: Get manifest
      run: |
        curl -L "https://storeedgefd.dsx.mp.microsoft.com/v9.0/packageManifests/${{ inputs.package_id }}" \
        -o manifest.json

    # ─────────────────────────────
    # Extract MSIX URL (robust Python parser)
    # ─────────────────────────────
    - name: Extract download URL
      run: |
        python3 << 'EOF'
        import json, re

        data = open("manifest.json","r",encoding="utf-8").read()

        # پیدا کردن همه لینک‌ها
        urls = re.findall(r"https?://[^\"]+\.msixbundle[^\"]*", data)

        if not urls:
            print("NO_URL_FOUND")
            exit(1)

        # اولویت x64
        url = None
        for u in urls:
            if "x64" in u:
                url = u
                break

        if not url:
            url = urls[0]

        print(url)

        with open("url.txt","w") as f:
            f.write(url)
        EOF

    - name: Load URL
      run: echo "URL=$(cat url.txt)" >> $GITHUB_ENV

    # ─────────────────────────────
    # Download with retry (like your script)
    # ─────────────────────────────
    - name: Download MSIX
      run: |
        mkdir -p downloads

        for i in 1 2 3; do
          echo "Attempt $i"
          curl -L --retry 3 --fail "$URL" -o downloads/codex.msixbundle && break
          sleep 10
        done

    # ─────────────────────────────
    # Validate file
    # ─────────────────────────────
    - name: Check file
      run: |
        ls -lh downloads
        test -f downloads/codex.msixbundle

    # ─────────────────────────────
    # Commit chunked (like your system)
    # ─────────────────────────────
    - name: Commit to repo
      if: ${{ inputs.upload_method == 'repository' }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add downloads/codex.msixbundle

        git commit -m "Add Codex MSIX bundle" || echo "No changes"
        git push

    # ─────────────────────────────
    # Release upload
    # ─────────────────────────────
    - name: Upload Release
      if: ${{ inputs.upload_method == 'release' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || format('codex-{0}', github.run_number) }}
        name: Codex Download
        files: downloads/codex.msixbundle

    # ─────────────────────────────
    # Cleanup
    # ─────────────────────────────
    - name: Cleanup temp
      if: always()
      run: |
        rm -f manifest.json url.txt
